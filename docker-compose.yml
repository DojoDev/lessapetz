version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lessapetz-app
    restart: always
    ports:
      - "18274:18274"
    environment:
      - NODE_ENV=production
      - PORT=18274

  db:
    image: postgres:15-alpine
    container_name: lessapetz-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: lessapetz
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
